# Starship prompt config
# https://starship.rs/config/

# Networked filesystems (kamino's NFS-mounted ~/nfs) can be slow to resolve
# symlinks for directory/git scanning -- don't follow them
follow_symlinks = false

# Don't print a new line at the start of the prompt
add_newline = true

# Left prompt layout -- $time trails the context line (not the input
# line) so it never gets swept into a copy/paste of the actual command
format = """
$username$hostname$sudo$directory$git_branch$git_status$nodejs$python$rust$golang$swift$container$docker_context$jobs$cmd_duration$time
$character"""

# Replace the default prompt symbol
[character]
success_symbol = "[❯](bold #5de4c7)"
error_symbol = "[❯](bold #d0679d)"
vimcmd_symbol = "[❮](bold #5de4c7)"

# Directory - show 3 levels, truncate to repo root
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #5de4c7"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Obsidian" = " "

# Git branch
[git_branch]
symbol = " "
style = "bold #f087bd"

# Git status - readable, spaced out
[git_status]
style = "#fffac2"
format = '([$all_status$ahead_behind]($style) )'
ahead = "↑${count} "
behind = "↓${count} "
diverged = "↕ ↑${ahead_count} ↓${behind_count} "
conflicted = "=${count} "
untracked = "?${count} "
stashed = "*${count} "
modified = "M${count} "
staged = "+${count} "
deleted = "D${count} "
renamed = "R${count} "

# Only show username if SSH or root
[username]
show_always = false
style_user = "bold #89ddff"
style_root = "bold #f087bd"
format = "[$user]($style)@"

# Only show hostname if SSH
[hostname]
ssh_only = true
style = "bold #add7ff"
format = "[$hostname]($style):"

# Command duration - only if > 2 seconds
[cmd_duration]
min_time = 2_000
style = "bold #fffac2"
format = "[󰥔 $duration]($style) "

# Package version - disabled (slow)
[package]
disabled = true

# Language versions - only show when relevant files exist
[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "

[python]
format = "[$symbol($version )]($style)"
symbol = " "

[rust]
format = "[$symbol($version )]($style)"
symbol = " "

[golang]
format = "[$symbol($version )]($style)"
symbol = " "

[swift]
format = "[$symbol($version )]($style)"
symbol = " "

# Docker context - only show if not default
[docker_context]
format = "[$symbol$context]($style) "
symbol = " "
only_with_files = true

# Container awareness - distinct from docker_context (which shows the
# active docker CLI context); this detects when the shell itself is
# running inside a container (e.g. after `docker exec -it ... bash`)
[container]
disabled = false

# Cached sudo credential indicator - meaningful on kamino (constant sudo
# for docker/NFS admin), harmless no-op on the Mac
[sudo]
disabled = false

# Background job indicator - catches a forgotten `docker compose logs -f`
# or long rsync backgrounded in a second pane
[jobs]
disabled = false

# Time - show timestamp for each command
[time]
disabled = false
format = "[ $time]($style) "
style = "dimmed #a6accd"
time_format = "%H:%M:%S"  # 24hr, or "%I:%M %p" for 12hr

# Kubernetes - disabled (slow, uncomment if you use k8s)
[kubernetes]
disabled = true

# AWS - disabled (uncomment if you use AWS)
[aws]
disabled = true

# Right-side prompt (disabled - can be slow)
[status]
disabled = true
