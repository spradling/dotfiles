# ZSH plugins, managed as chezmoi externals instead of one-time manual
# clones. `chezmoi apply` fetches these on first run and refreshes them
# on the interval below, instead of them sitting as untracked, aging
# clones (as they were on both the MacBook's old run_once script and
# kamino-legacy's hand-cloned copies).

[".zsh/zsh-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    refreshPeriod = "168h"

[".zsh/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions.git"
    refreshPeriod = "168h"

[".zsh/zsh-shift-select"]
    type = "git-repo"
    url = "https://github.com/jirutka/zsh-shift-select.git"
    refreshPeriod = "168h"
